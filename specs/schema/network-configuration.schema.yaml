version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  networkConfiguration:
    type: object
    properties:
      routing:
        $ref: network-routing-tunnels.schema.yaml#/$defs/routing
      tunnels:
        $ref: network-routing-tunnels.schema.yaml#/$defs/tunnels
      l2Announcements:
        $ref: network-firewall-nat.schema.yaml#/$defs/l2Announcements
      firewall:
        $ref: network-firewall-nat.schema.yaml#/$defs/firewall
      nat:
        $ref: network-firewall-nat.schema.yaml#/$defs/nat
      loadBalancing:
        $ref: network-load-balancing.schema.yaml#/$defs/loadBalancing
      listeners:
        $ref: network-load-balancing.schema.yaml#/$defs/listeners
      dhcp:
        $ref: network-dhcp.schema.yaml#/$defs/dhcp
      overlaySegmentIds:
        type: array
        uniqueItems: true
        items:
          $ref: common.schema.yaml#/$defs/reference
        description: IDs of overlay network segments used by this network configuration.
    additionalProperties: false
