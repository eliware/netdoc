version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
allOf:
  - $ref: common.schema.yaml#/$defs/object
  - if:
      properties:
        encapsulation: {}
      required: [encapsulation]
    then:
      properties:
        medium:
          const: virtual
type: object
properties:
  kind:
    const: network-segment
  id:
    $ref: common.schema.yaml#/$defs/identifier
    description: Required because machine interfaces reference network segments by ID.
  medium:
    enum: [ethernet, wireless, virtual, tunnel, other]
  vlan:
    oneOf:
      - type: integer
        minimum: 1
        maximum: 4094
      - const: untagged
    description: The VLAN ID on this segment, or untagged when frames have no VLAN tag.
  ipNetworks:
    type: array
    items:
      type: object
      properties:
        cidr:
          type: string
          minLength: 1
        gateway:
          type: string
      required: [cidr]
      additionalProperties: false
  encapsulation:
    type: object
    properties:
      type:
        const: vxlan
      vni:
        type: integer
        minimum: 1
        maximum: 16777215
        description: The VXLAN network identifier, when known.
      underlaySegmentId:
        $ref: common.schema.yaml#/$defs/reference
        description: The network segment that carries encapsulated VXLAN traffic.
      udpPort:
        type: integer
        minimum: 1
        maximum: 65535
        description: The configured UDP destination port, when known.
      mtu:
        type: integer
        minimum: 1
        maximum: 4294967295
        description: The configured MTU for inner packets, in bytes, when known.
      encryption:
        enum: [enabled, disabled, unknown]
        description: The overlay encryption state.
      endpoints:
        type: array
        items:
          type: object
          properties:
            nodeId:
              $ref: common.schema.yaml#/$defs/reference
              description: The ID of a host or network device that participates in this overlay.
            interfaceName:
              type: string
              minLength: 1
              description: The underlay interface name on the participating object, when known.
            underlayAddress:
              oneOf:
                - type: string
                  format: ipv4
                - type: string
                  format: ipv6
              description: The endpoint address that carries VXLAN traffic, when known.
          required: [nodeId]
          additionalProperties: false
    required: [type, underlaySegmentId]
    additionalProperties: false
unevaluatedProperties: false
required: [id, medium, vlan]
