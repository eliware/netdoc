version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  networkInterfaceAddresses:
    type: object
    properties:
      addresses:
        type: array
        items:
          type: object
          properties:
            cidr:
              type: string
              minLength: 1
              description: A stable IP address with its prefix length.
            assignment:
              enum:
                - static
                - dhcp
                - dhcp-reservation
                - virtual
            dnsNames:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 253
                pattern: '^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$'
              description: Names that point to this address. They do not configure DNS.
          required:
            - assignment
          allOf:
            - if:
                properties:
                  assignment:
                    enum:
                      - static
                      - dhcp-reservation
                      - virtual
              then:
                properties:
                  cidr: {}
                required: [cidr]
            - if:
                properties:
                  dnsNames: {}
                required: [dnsNames]
              then:
                required: [cidr]
          additionalProperties: false
