version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
allOf:
  - $ref: common.schema.yaml#/$defs/object
  - if:
      properties:
        roles:
          type: array
          contains:
            const: wireless-access-point
      required: [roles]
    else:
      not:
        properties:
          wirelessManagement: {}
        required: [wirelessManagement]
type: object
properties:
  kind:
    const: network-device
  roles:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        [
          router,
          switch,
          firewall,
          wireless-access-point,
          wireless-controller,
          modem,
          poe-injector,
          load-balancer,
          vpn-endpoint,
          network-overlay,
          cni,
          other,
        ]
  implementation:
    enum: [physical, software, distributed]
  firmware:
    type: string
  software:
    $ref: common.schema.yaml#/$defs/software
  hardware:
    $ref: common.schema.yaml#/$defs/hardware
  location:
    $ref: common.schema.yaml#/$defs/location
  residentOn:
    type: array
    items:
      $ref: common.schema.yaml#/$defs/reference
    description: NetDoc IDs of machines that run this software or distributed device.
  interfaces:
    type: array
    items:
      $ref: common.schema.yaml#/$defs/networkInterface
  switch:
    $ref: common.schema.yaml#/$defs/switchConfiguration
  networking:
    $ref: common.schema.yaml#/$defs/networkConfiguration
  wirelessManagement:
    type: object
    properties:
      state:
        enum: [managed, unmanaged, unknown]
      controllerId:
        $ref: common.schema.yaml#/$defs/reference
        description: The ID of a wireless controller for this access point.
    required: [state]
    additionalProperties: false
    description: Record wireless management only when its state is known or explicitly unknown.
unevaluatedProperties: false
required: [roles, implementation]
