version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  identifier:
    type: integer
    minimum: 1
    maximum: 9223372036854775807
    description: >-
      Use positive signed 64-bit Snowflake IDs as YAML integers. Add an ID only when a separate file
      must reference the object.
  reference:
    $ref: "#/$defs/identifier"
    description: A NetDoc ID that points to a separate object.
  object:
    type: object
    properties:
      version:
        const: "11.0"
      kind:
        type: string
        minLength: 1
      id:
        $ref: "#/$defs/identifier"
        description: Include only when a separate file must reference this object.
      name:
        type: string
        minLength: 1
        description: A label that identifies the object. Names can repeat on isolated networks.
      description:
        type: string
      lastReviewed:
        type: string
        format: date
        description: The date when someone last reviewed this inventory object.
      notes:
        type: array
        items:
          type: string
    required:
      - version
      - kind
      - name
      - lastReviewed
  size:
    type: object
    properties:
      value:
        type: number
        exclusiveMinimum: 0
      unit:
        enum:
          - B
          - KB
          - MB
          - GB
          - TB
          - KiB
          - MiB
          - GiB
          - TiB
    required:
      - value
      - unit
    additionalProperties: false
  frequency:
    type: object
    properties:
      value:
        type: number
        exclusiveMinimum: 0
      unit:
        enum:
          - MHz
          - GHz
    required:
      - value
      - unit
    additionalProperties: false
  dataRate:
    type: object
    properties:
      value:
        type: number
        exclusiveMinimum: 0
      unit:
        enum:
          - Mbps
          - Gbps
    required:
      - value
      - unit
    additionalProperties: false
  memory:
    type: object
    properties:
      capacity:
        $ref: "#/$defs/size"
      ecc:
        type: boolean
      speed:
        type: object
        properties:
          value:
            type: number
            exclusiveMinimum: 0
          unit:
            enum:
              - MHz
              - MT/s
        required:
          - value
          - unit
        additionalProperties: false
      modules:
        type: array
        items:
          type: object
          properties:
            capacity:
              $ref: "#/$defs/size"
            count:
              type: integer
              minimum: 1
          required:
            - capacity
            - count
          additionalProperties: false
    required:
      - capacity
    additionalProperties: false
  location:
    type: object
    properties:
      site:
        type: string
      provider:
        type: string
      region:
        type: string
      datacenter:
        type: string
      rack:
        type: string
      rackUnit:
        type: integer
        minimum: 1
    additionalProperties: false
  cpu:
    type: object
    properties:
      model:
        type: string
      sockets:
        type: integer
        minimum: 1
      cores:
        type: integer
        minimum: 1
      threads:
        type: integer
        minimum: 1
      baseClock:
        $ref: "#/$defs/frequency"
    additionalProperties: false
  gpu:
    type: object
    properties:
      model:
        type: string
      memory:
        $ref: "#/$defs/size"
    required:
      - model
    additionalProperties: false
  software:
    type: object
    properties:
      name:
        type: string
      version:
        type: string
    required:
      - name
    additionalProperties: false
  operatingSystem:
    $ref: "#/$defs/software"
  storageDevice:
    $ref: hardware-storage.schema.yaml#/$defs/storageDevice
  storage:
    $ref: hardware-storage.schema.yaml#/$defs/storage
  hardware:
    $ref: hardware-storage.schema.yaml#/$defs/hardware
  networkInterface:
    $ref: interface-switch.schema.yaml#/$defs/networkInterface
  switchConfiguration:
    $ref: interface-switch.schema.yaml#/$defs/switchConfiguration
  networkConfiguration:
    $ref: network-configuration.schema.yaml#/$defs/networkConfiguration
