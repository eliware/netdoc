version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
allOf:
  - $ref: common.schema.yaml#/$defs/object
type: object
properties:
  kind:
    const: physical-machine
  roles:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  username:
    type: string
    minLength: 1
    description: The SSH login name. Do not store a password or key.
  hardware:
    $ref: common.schema.yaml#/$defs/hardware
  storage:
    $ref: common.schema.yaml#/$defs/storage
  operatingSystem:
    $ref: common.schema.yaml#/$defs/operatingSystem
  interfaces:
    type: array
    items:
      $ref: common.schema.yaml#/$defs/networkInterface
  networking:
    $ref: common.schema.yaml#/$defs/networkConfiguration
  location:
    $ref: common.schema.yaml#/$defs/location
  providerAssetId:
    type: string
unevaluatedProperties: false
required: [roles]
