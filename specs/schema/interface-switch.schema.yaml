version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  networkInterface:
    type: object
    properties:
      id:
        $ref: common.schema.yaml#/$defs/identifier
        description: Include when another file must reference this interface.
      name:
        type: string
        minLength: 1
      type:
        enum:
          - ethernet
          - wireless
          - virtual-ethernet
          - tunnel
          - loopback
          - bridge
          - vlan
          - other
      macAddress:
        type: string
        pattern: ^(([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}|([0-9A-Fa-f]{2}-){5}[0-9A-Fa-f]{2})$
      speed:
        $ref: common.schema.yaml#/$defs/dataRate
      mtu:
        type: integer
        minimum: 1
      parentInterface:
        type: string
        minLength: 1
        description: The name of a parent interface in this file.
      segmentId:
        $ref: common.schema.yaml#/$defs/reference
        description: The ID of the attached network segment.
      addresses:
        type: array
        items:
          type: object
          properties:
            cidr:
              type: string
              minLength: 1
              description: A stable IP address with its prefix length.
            assignment:
              enum:
                - static
                - dhcp
                - dhcp-reservation
                - virtual
          required:
            - assignment
          if:
            properties:
              assignment:
                enum:
                  - static
                  - dhcp-reservation
                  - virtual
          then:
            properties:
              cidr: {}
            required:
              - cidr
          additionalProperties: false
      connectsTo:
        $ref: common.schema.yaml#/$defs/reference
        description: The peer interface ID. Both interfaces must reference each other.
      externalPeer:
        type: string
        minLength: 1
        description: A label for a peer outside this inventory.
      unused:
        const: true
        description: Mark a configured port with no connected peer.
      wireless:
        type: object
        properties:
          role:
            enum:
              - radio
              - client
          ssid:
            type: string
          band:
            type: string
        additionalProperties: false
      notes:
        type: array
        items:
          type: string
    required:
      - name
      - type
    allOf:
      - if:
          properties:
            connectsTo: {}
          required:
            - connectsTo
        then:
          properties:
            id: {}
          required:
            - id
      - if:
          properties:
            addresses:
              type: array
              minItems: 1
            type:
              not:
                const: loopback
          required:
            - addresses
            - type
        then:
          properties:
            segmentId: {}
          required:
            - segmentId
      - not:
          properties:
            connectsTo: {}
            externalPeer: {}
          required:
            - connectsTo
            - externalPeer
      - not:
          properties:
            connectsTo: {}
            unused: {}
          required:
            - connectsTo
            - unused
      - not:
          properties:
            externalPeer: {}
            unused: {}
          required:
            - externalPeer
            - unused
    additionalProperties: false
  switchConfiguration:
    type: object
    properties:
      management:
        enum:
          - managed
          - unmanaged
        description: Whether the switch supports per-port configuration.
      ports:
        type: array
        minItems: 1
        items:
          type: object
          properties:
            interfaceName:
              type: string
              minLength: 1
              description: The name of an interface on this network device.
            type:
              enum:
                - physical
                - internal
              description: Use internal for a router-facing logical interface.
            mode:
              enum:
                - access
                - trunk
            segmentId:
              $ref: common.schema.yaml#/$defs/reference
              description: The segment for an access port.
            segmentIds:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: common.schema.yaml#/$defs/reference
              description: Tagged segments allowed on a trunk port.
            pvidSegmentId:
              $ref: common.schema.yaml#/$defs/reference
              description: The segment for untagged traffic on a trunk port.
          required:
            - interfaceName
            - type
            - mode
          allOf:
            - if:
                properties:
                  mode:
                    const: access
                required:
                  - mode
              then:
                properties:
                  segmentId: {}
                  segmentIds: false
                  pvidSegmentId: false
                required:
                  - segmentId
            - if:
                properties:
                  mode:
                    const: trunk
                required:
                  - mode
              then:
                properties:
                  segmentId: false
                  segmentIds: {}
                required:
                  - segmentIds
          additionalProperties: false
    required:
      - management
      - ports
    additionalProperties: false
