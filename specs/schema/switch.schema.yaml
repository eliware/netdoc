version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  switchConfiguration:
    type: object
    properties:
      management:
        enum:
          - managed
          - unmanaged
        description: Whether the switch supports per-port configuration.
      ports:
        type: array
        minItems: 1
        items:
          type: object
          properties:
            interfaceName:
              type: string
              minLength: 1
              description: The name of an interface on this network device.
            type:
              enum:
                - physical
                - internal
              description: Use internal for a router-facing logical interface.
            mode:
              enum:
                - access
                - trunk
            segmentId:
              $ref: common.schema.yaml#/$defs/reference
              description: The segment for an access port.
            segmentIds:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: common.schema.yaml#/$defs/reference
              description: Tagged segments allowed on a trunk port.
            pvidSegmentId:
              $ref: common.schema.yaml#/$defs/reference
              description: The segment for untagged traffic on a trunk port.
          required:
            - interfaceName
            - type
            - mode
          allOf:
            - if:
                properties:
                  mode:
                    const: access
                required:
                  - mode
              then:
                properties:
                  segmentId: {}
                  segmentIds: false
                  pvidSegmentId: false
                required:
                  - segmentId
            - if:
                properties:
                  mode:
                    const: trunk
                required:
                  - mode
              then:
                properties:
                  segmentId: false
                  segmentIds: {}
                required:
                  - segmentIds
          additionalProperties: false
    required:
      - management
      - ports
    additionalProperties: false
