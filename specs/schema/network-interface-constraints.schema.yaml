version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  networkInterfaceConstraints:
    type: object
    allOf:
      - if:
          properties:
            connectsTo: {}
          required:
            - connectsTo
        then:
          properties:
            id: {}
          required:
            - id
      - if:
          properties:
            addresses:
              type: array
              minItems: 1
            type:
              not:
                const: loopback
          required:
            - addresses
            - type
        then:
          if:
            not:
              properties:
                type:
                  const: wireless
                wireless:
                  type: object
                  properties:
                    role:
                      const: client
                  required: [role]
              required: [type, wireless]
          then:
            properties:
              segmentId: {}
            required:
              - segmentId
      - if:
          properties:
            type:
              const: wireless
          required: [type]
        then:
          required: [wireless]
      - not:
          properties:
            connectsTo: {}
            externalPeer: {}
          required:
            - connectsTo
            - externalPeer
      - not:
          properties:
            connectsTo: {}
            unused: {}
          required:
            - connectsTo
            - unused
      - not:
          properties:
            externalPeer: {}
            unused: {}
          required:
            - externalPeer
            - unused
