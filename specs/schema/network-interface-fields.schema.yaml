version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  networkInterfaceFields:
    type: object
    properties:
      id:
        $ref: common.schema.yaml#/$defs/identifier
        description: Include when a separate file must reference this interface.
      name:
        type: string
        minLength: 1
      type:
        enum:
          - ethernet
          - wireless
          - virtual-ethernet
          - tunnel
          - loopback
          - bridge
          - vlan
          - other
      macAddress:
        type: string
        pattern: ^(([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}|([0-9A-Fa-f]{2}-){5}[0-9A-Fa-f]{2})$
      speed:
        $ref: common.schema.yaml#/$defs/dataRate
      mtu:
        type: integer
        minimum: 1
        maximum: 4294967295
        description: >-
          The configured MTU for this interface, in bytes. Use the field on ethernet, wireless,
          virtual-ethernet, tunnel, loopback, bridge, vlan, or other interfaces.
      parentInterface:
        type: string
        minLength: 1
        description: The name of a parent interface in this file.
      segmentId:
        $ref: common.schema.yaml#/$defs/reference
        description: The ID of the attached network segment.
      connectsTo:
        $ref: common.schema.yaml#/$defs/reference
        description: The peer interface ID. Both interfaces must reference each other.
      externalPeer:
        type: string
        minLength: 1
        description: A label for a peer outside this inventory.
      unused:
        const: true
        description: Mark an interface with no connected peer.
      wireless:
        type: object
        properties:
          role:
            enum: [radio, client]
          band:
            type: string
            minLength: 1
          channel:
            type: integer
            minimum: 1
          channelWidth:
            type: string
            minLength: 1
          broadcasts:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              properties:
                wirelessNetworkId:
                  $ref: common.schema.yaml#/$defs/reference
                segmentId:
                  $ref: common.schema.yaml#/$defs/reference
                bssid:
                  type: string
                  pattern: ^(([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}|([0-9A-Fa-f]{2}-){5}[0-9A-Fa-f]{2})$
                hidden:
                  type: boolean
              required: [wirelessNetworkId, segmentId]
              additionalProperties: false
          profiles:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              properties:
                wirelessNetworkId:
                  $ref: common.schema.yaml#/$defs/reference
                autoJoin:
                  type: boolean
                priority:
                  type: integer
                  minimum: 0
                accessPointId:
                  $ref: common.schema.yaml#/$defs/reference
              required: [wirelessNetworkId]
              additionalProperties: false
        additionalProperties: false
        required: [role]
        allOf:
          - if:
              properties:
                role:
                  const: radio
              required: [role]
            then:
              properties:
                broadcasts: {}
              required: [broadcasts]
          - if:
              properties:
                role:
                  const: client
              required: [role]
            then:
              properties:
                profiles: {}
              required: [profiles]
      notes:
        type: array
        items:
          type: string
    required:
      - name
      - type
