version: "11.0"
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  routing:
    type: object
    properties:
      defaultGateway:
        type: string
      staticRoutes:
        type: array
        items:
          type: object
          properties:
            destination:
              type: string
            nextHop:
              type: string
            interfaceName:
              type: string
          required:
            - destination
          anyOf:
            - properties:
                nextHop: {}
              required:
                - nextHop
            - properties:
                interfaceName: {}
              required:
                - interfaceName
          additionalProperties: false
      bgp:
        type: object
        properties:
          localAs:
            type: integer
            minimum: 1
            maximum: 4294967295
          routerId:
            type: string
          advertisedPrefixes:
            type: array
            uniqueItems: true
            items:
              type: string
          peers:
            type: array
            items:
              type: object
              properties:
                peerId:
                  $ref: common.schema.yaml#/$defs/reference
                address:
                  type: string
                remoteAs:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
              required:
                - address
                - remoteAs
              additionalProperties: false
        required:
          - localAs
        additionalProperties: false
      vrrp:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            vrid:
              type: integer
              minimum: 1
              maximum: 255
            interfaceName:
              type: string
            priority:
              type: integer
              minimum: 0
              maximum: 255
            virtualAddresses:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
          required:
            - vrid
            - interfaceName
            - virtualAddresses
          additionalProperties: false
        description: A shared address must have the same VRID and segment on each peer.
    additionalProperties: false
  tunnels:
    type: array
    items:
      type: object
      properties:
        type:
          enum:
            - wireguard
            - tailscale
            - other
        interfaceName:
          type: string
        localAddress:
          type: string
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
        peers:
          type: array
          items:
            type: object
            properties:
              endpointAddress:
                type: string
              endpointPort:
                type: integer
                minimum: 1
                maximum: 65535
              allowedNetworks:
                type: array
                items:
                  type: string
            additionalProperties: false
      required:
        - type
      additionalProperties: false
    description: Record tunnel topology. Do not store keys or credentials.
